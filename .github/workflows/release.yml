# Builds LanScout's installers and portable packages, and publishes them as
# a GitHub release when a version tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the version: the build writes it into mygo.json, so the apps
# say the version they were released as. A tag with a suffix, as
# v0.2.0-beta.1, makes a pre-release.
#
# Pushes to main that change how the apps are packaged build them too,
# without a release, as does running the workflow by hand: the packages are
# then the run's artifacts.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    # Paths do not filter tags: every version tag builds.
    paths:
      - .github/workflows/release.yml
      - mygo.json
      - go.mod
      - go.sum
      - resources/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Disk images need macOS. MyGo needs no cgo, so Linux builds the
          # Windows apps, with NSIS for their installers.
          - { name: macOS, os: macos-latest, platform: darwin/universal }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set the version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is not a version such as v1.2.3 or v1.2.3-beta.1"
              exit 1
            fi
            jq --arg v "$version" '.version = $v' mygo.json > mygo.json.new
            mv mygo.json.new mygo.json
          fi
          echo "NAME=$(jq -r .name mygo.json)" >> "$GITHUB_ENV"
          echo "VERSION=$(jq -r .version mygo.json)" >> "$GITHUB_ENV"

      - name: Test
        if: runner.os == 'macOS'
        run: go test ./...

      - name: Install NSIS
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build
        run: go tool mygo build -platform "${{ matrix.platform }}"

      # Renames the installers, whose names have spaces, and zips each app
      # to run without installing: LanScout-0.2.0-windows-amd64-setup.exe
      # and LanScout-0.2.0-windows-amd64.zip, for instance.
      - name: Package
        run: |
          mkdir -p dist stage
          for dir in build/*-*; do
            target="${dir#build/}"
            os="${target%%-*}"
            arch="${target#*-}"
            case "$os" in
            darwin)
              base="$NAME-$VERSION-macos-$arch"
              mv "$dir"/*.dmg "dist/$base.dmg"
              # Without the build machine's extended attributes, which the
              # signature does not cover, and which make __MACOSX folders.
              ditto -c -k --norsrc --noextattr --noacl --keepParent "$dir/$NAME.app" "dist/$base.zip"
              ;;
            windows)
              base="$NAME-$VERSION-windows-$arch"
              mv "$dir"/*Setup*.exe "dist/$base-setup.exe"
              # What remains is the app: the executable and its resources.
              cp -R "$dir" "stage/$NAME"
              (cd stage && zip -qr "../dist/$base.zip" "$NAME")
              rm -rf "stage/$NAME"
              ;;
            esac
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: mygo.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write the checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # gh uploads the files to a draft, and publishes it once they are all
      # there. A release made by hand on GitHub, before its tag built, gets
      # the files and keeps its notes.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            exit 0
          fi
          name="$(jq -r .name mygo.json)"
          v="${tag#v}"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag"
          cat > notes.md <<EOF
          ## 下载

          | 系统 | 安装包 | 免安装版 |
          | --- | --- | --- |
          | macOS（Apple 芯片和 Intel） | [$name-$v-macos-universal.dmg]($url/$name-$v-macos-universal.dmg) | [$name-$v-macos-universal.zip]($url/$name-$v-macos-universal.zip) |
          | Windows（x64，大多数电脑） | [$name-$v-windows-amd64-setup.exe]($url/$name-$v-windows-amd64-setup.exe) | [$name-$v-windows-amd64.zip]($url/$name-$v-windows-amd64.zip) |
          | Windows（ARM64） | [$name-$v-windows-arm64-setup.exe]($url/$name-$v-windows-arm64-setup.exe) | [$name-$v-windows-arm64.zip]($url/$name-$v-windows-arm64.zip) |

          应用暂未做代码签名：
          - macOS 第一次打开时如果提示无法打开或无法验证，请到「系统设置 › 隐私与安全性」，在页面下方点「仍要打开」。
          - Windows 如果提示「Windows 已保护你的电脑」，点「更多信息」，再点「仍要运行」。

          文件的 SHA-256 见 SHA256SUMS.txt。

          EOF
          flags=()
          if [[ "$tag" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" dist/* --verify-tag --title "$name $tag" \
            --notes-file notes.md --generate-notes "${flags[@]}"
